name: app_badger
description: "A Flutter plugin to update app badge count on Android, iOS, and macOS. Supports launcher-specific badge APIs on Android, native badge handling on iOS, and Dock tile badges on macOS."
version: 3.0.0
homepage: https://github.com/ajinkya446/app_badger
repository: https://github.com/ajinkya446/app_badger
issue_tracker: https://github.com/ajinkya446/app_badger/issues

environment:
  sdk: ">=3.7.2 <4.0.0"
  flutter: ">=3.44.8"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ajinkya.app_badger
        pluginClass: AppBadgerPlugin
      ios:
        pluginClass: AppBadgerPlugin
      macos:
        pluginClass: AppBadgerPlugin